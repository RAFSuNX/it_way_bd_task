name: Build Mobile Apps

on:
  push:
    branches: [ main, develop, release, release/*, beta/*, debug ]
  pull_request:
    branches: [ main ]

jobs:
  read-config:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.config.outputs.config }}
      build-type: ${{ steps.config.outputs.build-type }}
      flutter-env: ${{ steps.config.outputs.flutter-env }}
      build-android: ${{ steps.config.outputs.build-android }}
      build-ios: ${{ steps.config.outputs.build-ios }}
      sequential: ${{ steps.config.outputs.sequential }}
      branch-name: ${{ steps.config.outputs.branch-name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Read and process configuration
        id: config
        run: |
          # Read configuration file
          if [ -f "build-config.json" ]; then
            CONFIG=$(cat build-config.json | tr -d '\n' | tr -d '\r')
          else
            echo "build-config.json not found, using default values"
            CONFIG='{"app":{"name":"TaskManager","extractFromPubspec":true},"android":{"enabled":true,"outputFormat":["apk","aab"]},"ios":{"enabled":true,"codesign":false},"flutter":{"version":"3.35.1","channel":"stable"},"java":{"version":"17","distribution":"zulu"},"xcode":{"version":"latest-stable"},"testing":{"runTests":false,"testTimeout":"10m"},"workflow":{"sequential":true,"artifactRetentionDays":30},"branchMapping":{"default":"debug"},"environment":{"FLUTTER_ENV":"debug","environmentMapping":{"release":"production","beta":"staging","debug":"development"}}}'
          fi
          
          # Get branch name and determine build type
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Determine build type based on branch mapping
          BUILD_TYPE=$(echo $CONFIG | jq -r --arg branch "$BRANCH_NAME" '
            .branchMapping as $mapping |
            if $mapping[$branch] then $mapping[$branch]
            elif ($mapping | to_entries[] | select(.key | test("\\*$")) | select($branch | startswith(.key | rtrimstr("*")))) then
              ($mapping | to_entries[] | select(.key | test("\\*$")) | select($branch | startswith(.key | rtrimstr("*"))) | .value)
            else $mapping.default // "debug"
            end
          ')
          
          echo "build-type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          
          # Determine FLUTTER_ENV from config based on build type
          FLUTTER_ENV=$(echo $CONFIG | jq -r --arg buildType "$BUILD_TYPE" '
            if .environment.environmentMapping[$buildType] then
              .environment.environmentMapping[$buildType]
            else
              .environment.FLUTTER_ENV // $buildType
            end
          ')
          
          echo "flutter-env=$FLUTTER_ENV" >> $GITHUB_OUTPUT
          
          # Extract other configuration values
          BUILD_ANDROID=$(echo $CONFIG | jq -r '.android.enabled')
          BUILD_IOS=$(echo $CONFIG | jq -r '.ios.enabled')
          SEQUENTIAL=$(echo $CONFIG | jq -r '.workflow.sequential')
          
          echo "build-android=$BUILD_ANDROID" >> $GITHUB_OUTPUT
          echo "build-ios=$BUILD_IOS" >> $GITHUB_OUTPUT
          echo "sequential=$SEQUENTIAL" >> $GITHUB_OUTPUT
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          
          echo "=== Build Configuration ==="
          echo "Branch: $BRANCH_NAME"
          echo "Build Type: $BUILD_TYPE"
          echo "Flutter Environment: $FLUTTER_ENV"
          echo "Android build enabled: $BUILD_ANDROID"
          echo "iOS build enabled: $BUILD_IOS"
          echo "Sequential builds: $SEQUENTIAL"

  build-android:
    needs: read-config
    if: needs.read-config.outputs.build-android == 'true'
    uses: ./.github/workflows/build-android.yml
    with:
      config: ${{ needs.read-config.outputs.config }}
      build-type: ${{ needs.read-config.outputs.build-type }}
      flutter-env: ${{ needs.read-config.outputs.flutter-env }}
      branch-name: ${{ needs.read-config.outputs.branch-name }}
    secrets: inherit

  build-ios:
    needs: [read-config, build-android]
    if: needs.read-config.outputs.build-ios == 'true' && (needs.read-config.outputs.sequential != 'true' || always())
    uses: ./.github/workflows/build-ios.yml
    with:
      config: ${{ needs.read-config.outputs.config }}
      build-type: ${{ needs.read-config.outputs.build-type }}
      flutter-env: ${{ needs.read-config.outputs.flutter-env }}
      branch-name: ${{ needs.read-config.outputs.branch-name }}
    secrets: inherit

  create-release:
    needs: [read-config, build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Parse release configuration
        id: release-config
        run: |
          CONFIG='${{ needs.read-config.outputs.config }}'
          CREATE_RELEASE=$(echo $CONFIG | jq -r '.releaseConfig.createRelease // true')
          RELEASE_NAME_TEMPLATE=$(echo $CONFIG | jq -r '.releaseConfig.releaseName // "Task Management System v{version} ({buildType})"')
          TAG_FORMAT=$(echo $CONFIG | jq -r '.releaseConfig.tagFormat // "v{version}-{buildType}-{buildNumber}"')
          
          BUILD_TYPE='${{ needs.read-config.outputs.build-type }}'
          IS_PRERELEASE=$(echo $CONFIG | jq -r --arg buildType "$BUILD_TYPE" '.releaseConfig.includePrerelease[$buildType] // true')
          
          echo "create-release=$CREATE_RELEASE" >> $GITHUB_OUTPUT
          echo "release-name-template=$RELEASE_NAME_TEMPLATE" >> $GITHUB_OUTPUT
          echo "tag-format=$TAG_FORMAT" >> $GITHUB_OUTPUT
          echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | cut -d '+' -f 2)
          BUILD_TYPE='${{ needs.read-config.outputs.build-type }}'
          
          # Generate timestamp for unique releases
          TIMESTAMP=$(date -u '+%Y%m%d-%H%M%S')
          
          # Replace placeholders in release name and tag
          RELEASE_NAME='${{ steps.release-config.outputs.release-name-template }}'
          RELEASE_NAME=${RELEASE_NAME//\{version\}/$VERSION}
          RELEASE_NAME=${RELEASE_NAME//\{buildType\}/$BUILD_TYPE}
          RELEASE_NAME=${RELEASE_NAME//\{buildNumber\}/$BUILD_NUMBER}
          
          TAG_NAME='${{ steps.release-config.outputs.tag-format }}'
          TAG_NAME=${TAG_NAME//\{version\}/$VERSION}
          TAG_NAME=${TAG_NAME//\{buildType\}/$BUILD_TYPE}
          TAG_NAME=${TAG_NAME//\{buildNumber\}/$BUILD_NUMBER}
          
          # Add timestamp to make releases unique
          RELEASE_NAME="$RELEASE_NAME - $TIMESTAMP"
          TAG_NAME="$TAG_NAME-$TIMESTAMP"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download Android APK artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: "android-apks-${{ needs.read-config.outputs.build-type }}-*"
          path: ./artifacts/android/
          merge-multiple: true

      - name: Download Android AAB artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: "*_*_${{ needs.read-config.outputs.build-type }}_*.aab"
          path: ./artifacts/android/
          merge-multiple: true

      - name: Download iOS artifacts
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: "*_*_${{ needs.read-config.outputs.build-type }}_*.ipa"
          path: ./artifacts/ios/
          merge-multiple: true

      - name: Create Release Notes
        id: release_notes
        run: |
          BUILD_TYPE='${{ needs.read-config.outputs.build-type }}'
          BRANCH_NAME='${{ needs.read-config.outputs.branch-name }}'
          
          # Extract short commit hash for better readability
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          cat > release_notes.md << EOF
          ## Build Information
          
          \`\`\`
          Build Type:     $BUILD_TYPE
          Branch:         $BRANCH_NAME
          Build Number:   ${{ steps.version.outputs.build_number }}
          Timestamp:      ${{ steps.version.outputs.timestamp }}
          Commit ID:      $SHORT_SHA
          Full SHA:       ${{ github.sha }}
          Build Date:     $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Flutter:        $(echo '${{ needs.read-config.outputs.config }}' | jq -r '.flutter.version')
          \`\`\`
          
          ## Available Artifacts
          
          EOF
          
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "### Android Platform" >> release_notes.md
            echo "" >> release_notes.md
            echo "**APK Files (Architecture-Specific)**" >> release_notes.md
            echo "- Optimized with --shrink and --split-per-abi flags" >> release_notes.md
            echo "- Reduced size through architecture splitting" >> release_notes.md
            echo "- Direct installation on Android devices" >> release_notes.md
            echo "" >> release_notes.md
            echo "**AAB Bundle**" >> release_notes.md
            echo "- Android App Bundle for Google Play Store distribution" >> release_notes.md
            echo "- Dynamic delivery and size optimization" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          if [ "${{ needs.build-ios.result }}" == "success" ]; then
            echo "### iOS Platform" >> release_notes.md
            echo "" >> release_notes.md
            echo "**IPA Archive**" >> release_notes.md
            echo "- iOS application archive for distribution" >> release_notes.md
            echo "- Manual IPA creation for unsigned builds" >> release_notes.md
            echo "- Compatible with development and testing environments" >> release_notes.md
            echo "" >> release_notes.md
          fi
          
          echo "## Build Configuration" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`json" >> release_notes.md
          echo "{" >> release_notes.md
          echo "  \"flutter_version\": \"$(echo '${{ needs.read-config.outputs.config }}' | jq -r '.flutter.version')\"," >> release_notes.md
          echo "  \"build_type\": \"$BUILD_TYPE\"," >> release_notes.md
          echo "  \"branch\": \"$BRANCH_NAME\"," >> release_notes.md
          echo "  \"android_enabled\": ${{ needs.read-config.outputs.build-android }}," >> release_notes.md
          echo "  \"ios_enabled\": ${{ needs.read-config.outputs.build-ios }}," >> release_notes.md
          echo "  \"optimizations\": {" >> release_notes.md
          echo "    \"shrink\": true," >> release_notes.md
          echo "    \"split_per_abi\": true," >> release_notes.md
          echo "    \"obfuscate\": $([ "$BUILD_TYPE" = "release" ] && echo "true" || echo "false")" >> release_notes.md
          echo "  }" >> release_notes.md
          echo "}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Platform Status" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Platform | Status | Enabled |" >> release_notes.md
          echo "|----------|--------|---------|" >> release_notes.md
          
          if [ "${{ needs.read-config.outputs.build-android }}" == "true" ]; then
            if [ "${{ needs.build-android.result }}" == "success" ]; then
              echo "| Android | SUCCESS | true |" >> release_notes.md
            else
              echo "| Android | FAILED | true |" >> release_notes.md
            fi
          else
            echo "| Android | SKIPPED | false |" >> release_notes.md
          fi
          
          if [ "${{ needs.read-config.outputs.build-ios }}" == "true" ]; then
            if [ "${{ needs.build-ios.result }}" == "success" ]; then
              echo "| iOS | SUCCESS | true |" >> release_notes.md
            else
              echo "| iOS | FAILED | true |" >> release_notes.md
            fi
          else
            echo "| iOS | SKIPPED | false |" >> release_notes.md
          fi

      - name: Create GitHub Release
        if: steps.release-config.outputs.create-release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.release_name }}
          body_path: release_notes.md
          files: |
            artifacts/android/*
            artifacts/ios/*
          draft: false
          prerelease: ${{ steps.release-config.outputs.is-prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    needs: [read-config, build-android, build-ios, create-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ needs.read-config.outputs.branch-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Type:** ${{ needs.read-config.outputs.build-type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Enabled |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.read-config.outputs.build-android }}" == "true" ]; then
            if [ "${{ needs.build-android.result }}" == "success" ]; then
              echo "| Android | ✅ Success | Yes |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Android | ❌ Failed | Yes |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| Android | ⏭️ Skipped | No |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.read-config.outputs.build-ios }}" == "true" ]; then
            if [ "${{ needs.build-ios.result }}" == "success" ]; then
              echo "| iOS | ✅ Success | Yes |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| iOS | ❌ Failed | Yes |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| iOS | ⏭️ Skipped | No |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.create-release.result }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 **GitHub Release Created Successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "Check the [Releases page](https://github.com/${{ github.repository }}/releases) to download the built apps." >> $GITHUB_STEP_SUMMARY
          fi
